<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>The Social Dev</title>
  <script type="text/javascript">
    // Dynamic SPA 404 redirect handler (Supports Vercel, Netlify, Custom Domains & GitHub Pages)
    (function() {
      var l = window.location;
      
      // Check if we are on GitHub Pages subpath (/The_Social_dev)
      var hasSubpath = l.pathname.toLowerCase().startsWith('/the_social_dev');
      var basePath = hasSubpath ? '/The_Social_dev' : '';
      var remainingPath = hasSubpath ? l.pathname.substring('/The_Social_dev'.length) : l.pathname;
      
      if (!remainingPath || remainingPath === '/') {
        remainingPath = '';
      }

      // Encode path into hash format (e.g. #/admin)
      var redirectUrl = l.protocol + '//' + l.host + basePath + '/#' + (remainingPath.startsWith('/') ? remainingPath : '/' + remainingPath);
      
      // Avoid infinite loop if already on hash
      if (l.hash) {
        redirectUrl += l.hash;
      }

      l.replace(redirectUrl);
    })();
  </script>
</head>
<body>
  <p>Redirecting...</p>
</body>
</html>
