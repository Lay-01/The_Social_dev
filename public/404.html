<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>The Social Dev</title>
  <script type="text/javascript">
    // Dynamic SPA 404 redirect handler (Supports Vercel, Netlify, Custom Domains & GitHub Pages)
    // Preserves query strings (?token_hash=...&type=recovery) and hash fragments (#access_token=...)
    (function() {
      var l = window.location;
      
      // Check if we are on GitHub Pages subpath (/The_Social_dev)
      var hasSubpath = l.pathname.toLowerCase().startsWith('/the_social_dev');
      var basePath = hasSubpath ? '/The_Social_dev' : '';
      var remainingPath = hasSubpath ? l.pathname.substring('/The_Social_dev'.length) : l.pathname;
      
      if (!remainingPath || remainingPath === '/') {
        remainingPath = '';
      }

      // Preserve query params (?type=recovery) and hash fragments (#access_token=...)
      var extraParams = (l.search || '') + (l.hash || '');
      var formattedPath = remainingPath.startsWith('/') ? remainingPath : '/' + remainingPath;

      // Encode path into hash format (e.g. #/admin?type=recovery)
      var redirectUrl = l.protocol + '//' + l.host + basePath + '/#' + formattedPath + extraParams;

      l.replace(redirectUrl);
    })();
  </script>
</head>
<body>
  <p>Redirecting...</p>
</body>
</html>
